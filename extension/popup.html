<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GPT 划词解释</title>
    <link rel="stylesheet" href="vendor/katex/katex.min.css">
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <div class="paper-grain" aria-hidden="true"></div>
    <main class="shell">
      <header class="masthead">
        <div>
          <p class="eyebrow">LEXI · LOCAL CODEX</p>
          <h1>划词解释</h1>
        </div>
        <div class="masthead-actions">
          <button id="libraryButton" class="icon-button" type="button" aria-label="打开解释资料库" title="解释资料库">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4Zm3 16a3 3 0 0 1 0-6h11M9 8h6"/></svg>
          </button>
          <button id="settingsButton" class="icon-button" type="button" aria-label="打开设置" title="设置">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10M14 4v6M6 14v6"/></svg>
          </button>
        </div>
      </header>

      <section id="emptyState" class="empty-state">
        <span class="selection-mark" aria-hidden="true">Aa</span>
        <h2>选中，然后理解。</h2>
        <p>在任意网页选中文字，右键选择<br><strong>“用 GPT 解释”</strong>。</p>
        <button id="checkButton" class="text-button" type="button">检查本地连接 →</button>
        <p id="healthText" class="health-text" aria-live="polite"></p>
      </section>

      <section id="resultView" class="result-view" hidden>
        <div class="meta-row" aria-label="当前模型配置">
          <span id="modelBadge" class="badge"></span>
          <span id="reasoningBadge" class="badge"></span>
          <label class="language-picker" title="设置回答语言（下一条回答生效）">
            <span class="sr-only">回答语言</span>
            <select id="languageSelect" aria-label="回答语言">
              <option value="en">EN</option>
              <option value="zh-CN">中文</option>
              <option value="de">DE</option>
              <option value="fr">FR</option>
              <option value="it">IT</option>
              <option value="auto">AUTO</option>
            </select>
          </label>
          <span id="branchBadge" class="badge branch-badge" hidden>分支解释</span>
          <span id="statusBadge" class="status-badge"><i></i><span></span></span>
        </div>

        <section class="source-card" aria-labelledby="sourceHeading">
          <div class="source-heading">
            <span id="sourceHeading">解释对象</span>
            <span id="sourceCount" class="source-count"></span>
          </div>
          <blockquote id="sourceText"></blockquote>
          <p class="source-meta-row">
            <span id="sourceMeta" class="source-meta"></span>
            <a id="sourceLink" class="source-link" target="_blank" rel="noopener noreferrer">打开原网页 ↗</a>
          </p>
          <p id="truncatedNotice" class="notice" hidden>原文较长，已截取前 50,000 个字符。</p>

          <div id="parentRelation" class="relation-panel parent-relation" hidden>
            <span class="relation-kicker">来源指针</span>
            <q id="parentQuote"></q>
            <button id="parentButton" class="relation-button" type="button">回到选取位置 ↖</button>
          </div>

          <div id="childrenRelation" class="relation-panel children-relation" hidden>
            <div class="relation-heading">
              <span class="relation-kicker">由此产生的解释</span>
              <span id="childrenCount" class="relation-count"></span>
            </div>
            <div id="childrenList" class="children-list"></div>
          </div>
        </section>

        <section id="conversationMessages" class="conversation-messages" aria-live="polite"></section>
      </section>
    </main>

    <footer id="conversationDock" class="conversation-dock" hidden>
      <div class="toolbar-actions">
        <button id="copyButton" type="button">复制对话</button>
        <button id="retryButton" type="button">重新解释</button>
        <button id="stopButton" class="stop-button" type="button">停止</button>
      </div>
      <form id="followupForm" class="followup-form">
        <label class="sr-only" for="followupInput">继续追问</label>
        <textarea id="followupInput" rows="1" maxlength="12000" placeholder="继续追问这条解释…"></textarea>
        <button id="sendButton" type="submit" aria-label="发送追问">发送</button>
      </form>
    </footer>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="vendor/katex/katex.min.js"></script>
    <script src="vendor/katex/contrib/auto-render.min.js"></script>
    <script src="vendor/marked/marked.umd.js"></script>
    <script src="vendor/dompurify/purify.min.js"></script>
    <script type="module" src="popup.js"></script>
  </body>
</html>
